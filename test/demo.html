<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Vinyl Card - تجربة محلية</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; background: #15151a; color: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  form { display: grid; gap: 10px; background: #1f1f27; padding: 16px; border-radius: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: #bbb; }
  input[type=text], select { padding: 8px; border-radius: 8px; border: 1px solid #3a3a46; background: #101015; color: #eee; }
  .row { display: flex; gap: 16px; align-items: center; }
  img { width: 100%; max-width: 1040px; border-radius: 12px; display: block; background: #000; }
  .url { direction: ltr; font: 12px monospace; word-break: break-all; color: #8aa; margin-top: 10px; }
  .small { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 24px; }
  .small figure { margin: 0; } figcaption { font-size: 12px; color: #999; margin-top: 6px; }
</style>
</head>
<body>
<h1>Vinyl Card - معاينة محلية</h1>
<div class="grid">
  <form id="f">
    <label>اسم الأغنية <input type="text" id="name" value="Blinding Lights"></label>
    <label>الفنان <input type="text" id="artist" value="The Weeknd"></label>
    <label>الغلاف
      <select id="thumb">
        <option value="/thumbs/cover-warm.png">warm</option>
        <option value="/thumbs/cover-blue.png">blue</option>
        <option value="/thumbs/cover-green.png">green (16:9)</option>
        <option value="/thumbs/cover-light.png">light</option>
        <option value="">بدون غلاف (fallback)</option>
      </select>
    </label>
    <label>التقدم: <span id="pv">45</span>% <input type="range" id="progress" min="0" max="100" value="45"></label>
    <label>الصوت: <span id="vv">100</span>% <input type="range" id="volume" min="0" max="100" value="100"></label>
    <label>الوقت الحالي <input type="text" id="cur" value="1:30"></label>
    <label>المدة <input type="text" id="dur" value="3:20"></label>
    <div class="row">
      <label class="row"><input type="checkbox" id="paused"> Paused</label>
      <label class="row"><input type="checkbox" id="live"> Live</label>
    </div>
    <label>الحجم (scale)
      <select id="scale"><option>2.5</option><option selected>5</option></select>
    </label>
  </form>
  <div>
    <img id="main" alt="card">
    <div class="url" id="url"></div>
  </div>
</div>

<div class="small" id="presets"></div>

<script>
const $ = (id) => document.getElementById(id);
const origin = location.origin;

function build(o) {
  const track = {
    name: o.name,
    thumbnail: o.thumb ? origin + o.thumb : undefined,
    uploader: { name: o.artist },
    isLive: !!o.live,
  };
  const p = new URLSearchParams({
    track: JSON.stringify(track),
    progress: o.progress, currentTime: o.cur, duration: o.dur,
    volume: o.volume, paused: !!o.paused, scale: o.scale || 5,
  });
  return '/vinyl?' + p.toString();
}

function read() {
  return {
    name: $('name').value, artist: $('artist').value, thumb: $('thumb').value,
    progress: $('progress').value, volume: $('volume').value,
    cur: $('cur').value, dur: $('dur').value,
    paused: $('paused').checked, live: $('live').checked, scale: $('scale').value,
  };
}

let timer;
function update() {
  $('pv').textContent = $('progress').value;
  $('vv').textContent = $('volume').value;
  clearTimeout(timer);
  timer = setTimeout(() => {
    const u = build(read());
    $('main').src = u;
    $('url').textContent = origin + u;
  }, 200);
}
$('f').addEventListener('input', update);
update();

const base = { name: 'Blinding Lights', artist: 'The Weeknd', thumb: '/thumbs/cover-warm.png', progress: 45, volume: 100, cur: '1:30', dur: '3:20', scale: 2.5 };
const presets = [
  ['Playing', { ...base }],
  ['Paused', { ...base, paused: true, thumb: '/thumbs/cover-blue.png', volume: 60 }],
  ['Live', { ...base, live: true, name: 'Quran Radio - Live 24/7', artist: 'Quran Radio', thumb: '/thumbs/cover-green.png', progress: 100, volume: 80 }],
  ['عربي', { ...base, name: 'سورة البقرة - مشاري راشد العفاسي', artist: 'قناة القرآن الكريم', thumb: '/thumbs/cover-blue.png', cur: '12:05', dur: '1:02:10' }],
];
for (const [label, o] of presets) {
  const fig = document.createElement('figure');
  fig.innerHTML = `<img src="${build(o)}" alt="${label}"><figcaption>${label}</figcaption>`;
  $('presets').appendChild(fig);
}
const queueItems = [
  { name: 'Blinding Lights', thumbnail: origin + '/thumbs/cover-warm.png', uploader: { name: 'The Weeknd' } },
  { name: 'Save Your Tears', thumbnail: origin + '/thumbs/cover-blue.png', uploader: { name: 'The Weeknd' } },
  { name: 'سورة الرحمن', thumbnail: origin + '/thumbs/cover-green.png', uploader: 'قناة القرآن الكريم' },
  { name: 'Levitating', thumbnail: origin + '/thumbs/cover-light.png', uploader: { name: 'Dua Lipa' } },
];
const queueUrl = '/queue?' + new URLSearchParams({ items: JSON.stringify(queueItems), currentIndex: 0, more: 3, progress: 45, currentTime: '1:30', duration: '3:20', volume: 80, paused: false, scale: 2.5 });
{
  const fig = document.createElement('figure');
  fig.innerHTML = `<img src="${queueUrl}" alt="Queue"><figcaption>Queue</figcaption>`;
  $('presets').appendChild(fig);
}
</script>
</body>
</html>
